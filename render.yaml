services:
  - type: web
    name: tool-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_BACKEND
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false          # you set this manually in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
